<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }

        .grid-item {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .grid-item h2 {
            margin-top: 0;
            color: #555;
            font-size: 24px;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>個人作品集</h1>

    <div class="grid-container">
        <div class="grid-item">
            <h2 contenteditable="true">自我介紹</h2>
            <p contenteditable="true">請在此輸入您的自我介紹內容。</p>
        </div>

        <div class="grid-item">
            <h2 contenteditable="true">大頭貼</h2>
            <p contenteditable="true">請在此放置您的大頭貼照片。</p>
        </div>
    </div>

    <h2>作品區</h2>
    <div class="grid-container" style="grid-template-columns: repeat(3, 1fr);">
        <div class="grid-item">
            <h2 contenteditable="true">作品標題 1</h2>
            <p contenteditable="true">請在此輸入作品內容 1。</p>
        </div>
        <div class="grid-item">
            <h2 contenteditable="true">作品標題 2</h2>
            <p contenteditable="true">請在此輸入作品內容 2。</p>
        </div>
        <div class="grid-item">
            <h2 contenteditable="true">作品標題 3</h2>
            <p contenteditable="true">請在此輸入作品內容 3。</p>
        </div>
    </div>

    <h2>聯絡區</h2>
    <form style="max-width: 600px; margin: 0 auto;padding: 20px;background: #fff;border-radius: 10px;">
        <label for="name">姓名:</label>
        <input type="text" id="name" name="name" required style="margin: 10px 0;">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required style="margin: 10px 0;">
        <br>
        <label for="message">留言:</label>
        <textarea id="message" name="message" rows="4" cols="50" required style="margin: 10px 0;"></textarea>
        <br>
        <button type="submit" style="padding: 10px 20px;background: #007bff;color: white;border: none;cursor: pointer;">提交</button>
    </form>
</html>
