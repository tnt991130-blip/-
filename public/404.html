<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f9fc" />
    <meta name="robots" content="noindex" />
    <title>找不到頁面｜王宥崴</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 75% 25%, rgba(95, 194, 220, .2), transparent 30rem), #f5f9fc; color: #102333; }
      main { width: min(100% - 2rem, 42rem); padding: clamp(2rem, 8vw, 5rem); border: 1px solid rgba(48, 83, 107, .16); border-radius: 2rem; background: rgba(255, 255, 255, .76); box-shadow: 0 1.25rem 4rem rgba(23, 49, 80, .12); text-align: center; backdrop-filter: blur(14px); }
      p { margin: 0; color: #627888; line-height: 1.7; }
      .code { color: #08718c; font-size: .75rem; font-weight: 700; letter-spacing: .14em; }
      h1 { margin: 1rem 0; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.06em; line-height: 1; }
      a { display: inline-flex; min-height: 3rem; align-items: center; justify-content: center; margin-top: 2rem; padding: 0 1.25rem; border-radius: 999px; background: #0e7490; color: #f5fcff; font-size: .875rem; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0e7490; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { body { background: radial-gradient(circle at 75% 25%, rgba(65, 184, 214, .2), transparent 30rem), #09121a; color: #edf7fb; } main { border-color: rgba(172, 210, 227, .18); background: rgba(16, 28, 38, .86); box-shadow: 0 1.25rem 4rem rgba(0, 0, 0, .32); } p { color: #9eb1bd; } .code { color: #7dd9eb; } }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR / 404</p>
      <h1>找不到這個頁面</h1>
      <p>你要找的內容不存在或已變更位置。</p>
      <a href="/self-introduction-website/">返回首頁</a>
    </main>
  </body>
</html>
